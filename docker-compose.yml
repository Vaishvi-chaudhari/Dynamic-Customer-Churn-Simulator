version: "3.9"

services:
  # ─── FastAPI Backend ─────────────────────────────────────────────────────
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DB_PATH=/app/churn_simulator.db

  # ─── Streamlit Dashboard ─────────────────────────────────────────────────
  dashboard:
    build: .
    command: streamlit run streamlit_app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - DB_PATH=/app/churn_simulator.db
    depends_on:
      - api
